async function loadContent() {
  try {
    const res = await fetch('content.json');
    if (!res.ok) throw new Error('nicht gefunden');
    const data = await res.json();
    render(data);
  } catch (e) {
    render(FALLBACK_CONTENT);
  }
}

function render(data) {
  const { meta, hero, philosophy, concept, reviews, gallery, reservation, hoursLocation } = data;

  document.title = `${meta.restaurantName} — ${meta.tagline}`;
  document.getElementById('nav-name').textContent = meta.restaurantName;

  document.getElementById('hero-eyebrow').textContent = hero.eyebrow;
  document.getElementById('hero-headline').textContent = hero.headline;
  document.getElementById('hero-sub').textContent = hero.subtext;

  document.getElementById('philosophy-heading').textContent = philosophy.heading;
  document.getElementById('philosophy-quote').textContent = philosophy.paragraphs[0] || '';
  document.getElementById('philosophy-badge').textContent = philosophy.badge || '';
  document.getElementById('philosophy-body').innerHTML =
    philosophy.paragraphs.slice(1).map(p => `<p>${escapeHtml(p)}</p>`).join('');

  document.getElementById('concept-heading').textContent = concept.heading;
  document.getElementById('concept-note').textContent = concept.note || '';
  document.getElementById('concept-facts').innerHTML = concept.facts.map(f => `
    <div class="fact">
      <div class="fact-value">${escapeHtml(f.value)}</div>
      <div class="fact-label mono">${escapeHtml(f.label)}</div>
    </div>
  `).join('');

  document.getElementById('reviews-heading').textContent = reviews.heading;
  document.getElementById('reviews-meta').innerHTML =
    `<strong>${escapeHtml(reviews.ratingValue)} ★</strong><span>${escapeHtml(reviews.ratingCount)} Google-Bewertungen — ${escapeHtml(reviews.note || '')}</span>`;
  const shuffled = [...reviews.items].sort(() => Math.random() - 0.5);
  const pickedReviews = shuffled.slice(0, 4);
  document.getElementById('review-wall').innerHTML = pickedReviews.map(r => `
    <div class="review-card">
      <div class="review-pin"></div>
      <div class="review-stars mono">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
      <p class="review-quote">„${escapeHtml(r.quote)}"</p>
    </div>
  `).join('');

  document.getElementById('gallery-heading').textContent = gallery.heading;
  const galBody = document.getElementById('gallery-body');
  if (gallery.images && gallery.images.length > 0) {
    galBody.className = 'gallery-grid';
    galBody.innerHTML = gallery.images.map(src => `<div><img src="${src}" alt="${meta.restaurantName}" loading="lazy"></div>`).join('');
  } else {
    galBody.className = 'gallery-placeholder';
    galBody.innerHTML = ['Foto folgt', 'Foto folgt', 'Foto folgt'].map(label => `
      <div class="gallery-frame">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="4" y="10" width="32" height="23" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M13 10l2.5-4h9l2.5 4" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="20" cy="21.5" r="6.5" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span class="mono">${escapeHtml(label)}</span>
      </div>
    `).join('');
  }

  document.getElementById('reservation-heading').textContent = reservation.heading;
  document.getElementById('reservation-text').textContent = reservation.text;
  document.getElementById('reservation-hours').textContent = reservation.hoursNote || '';
  document.getElementById('reservation-formhint-text').textContent = reservation.formHint || '';
  document.getElementById('res-submit').textContent = reservation.ctaLabel;
  const contactLines = [];
  if (meta.phone) contactLines.push(`<a class="contact-line" href="tel:${meta.phone.replace(/\s+/g, '')}">${escapeHtml(meta.phone)}</a>`);
  if (meta.email) contactLines.push(`<a class="contact-line" href="mailto:${meta.email}">${escapeHtml(meta.email)}</a>`);
  document.getElementById('reservation-contact').innerHTML = contactLines.join('');

  // Datumsfeld: echter Kalender, So & Mo direkt ausgegraut/nicht wählbar
  const dateInput = document.getElementById('res-date');
  let picker = null;
  if (window.flatpickr) {
    picker = window.flatpickr(dateInput, {
      locale: window.flatpickr.l10ns && window.flatpickr.l10ns.de ? 'de' : undefined,
      dateFormat: 'Y-m-d',
      altInput: true,
      altFormat: 'd.m.Y',
      minDate: 'today',
      allowInput: false,
      disable: [ (date) => date.getDay() === 0 || date.getDay() === 1 ]
    });
  }

  const resForm = document.getElementById('res-form');
  resForm.onsubmit = (e) => {

    const people = document.getElementById('res-people').value;
    const email = document.getElementById('res-email').value;
    const date = dateInput.value;

      `E-Mail: ${email}`,

  if (meta.facebook) links.push(`<a href="https://facebook.com/${meta.facebook}" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M13.4 9.2h1.4V6.8h-1.7c-1.7 0-2.7 1-2.7 2.8v1.5H8.6v2.3h1.8V19h2.3v-5.6h1.8l.3-2.3h-2.1V9.9c0-.5.2-.7.7-.7z" fill="currentColor" stroke="none"/></svg></a>`);
  const emailLink = document.getElementById('footer-email');
  if (meta.email) {
    emailLink.href = `mailto:${meta.email}`;
    emailLink.textContent = meta.email;
  } else {
    emailLink.style.display = 'none';
  }
  footerLinks.innerHTML = links.join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadContent();

// Aktiven Nav-Link beim Scrollen hervorheben
const navLinks = Array.from(document.querySelectorAll('.nav-links a[href^="#"]'));
const sections = navLinks
  .map(a => document.querySelector(a.getAttribute('href')))
  .filter(Boolean);

if ('IntersectionObserver' in window && sections.length) {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const link = navLinks.find(a => a.getAttribute('href') === `#${entry.target.id}`);
      if (!link) return;
      if (entry.isIntersecting) {
        navLinks.forEach(a => a.classList.remove('active'));
        link.classList.add('active');
      }
    });
  }, { rootMargin: '-40% 0px -50% 0px', threshold: 0 });
  sections.forEach(s => observer.observe(s));
}
